spring:
  application:
    name: statefulscanner

server:
  port: 8080

scanner:
  rate-limiter:
    # CLI shorthand --rate=N is wired here. Range [1, 10000]; default 100.
    permits-per-second: ${rate:100.0}
    # Cold-start ramp window in seconds; 0 disables warmup.
    warmup-period-seconds: ${rate-warmup:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.statefulscanner: DEBUG

